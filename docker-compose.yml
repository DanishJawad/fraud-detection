services:
  fraud-api:
    build: .
    container_name: fraud-detection-api
    ports:
      - "8000:8000"
    volumes:
      # models/ is gitignored and built locally by scripts/train.py. Run that
      # before `docker compose up` or the API starts and reports unhealthy.
      - ./models:/app/models
    environment:
      - MODEL_VERSION=1.0.0
      # No OPTIMAL_THRESHOLD here: the threshold comes from the trained
      # artifact in models/metadata.json, never from the environment.
    restart: unless-stopped

  monitoring-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: fraud-monitoring
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://fraud-api:8000
    depends_on:
      - fraud-api
    restart: unless-stopped
