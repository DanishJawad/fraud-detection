version: '3.8'

services:
  fraud-api:
    build: .
    container_name: fraud-detection-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./monitoring:/app/monitoring
    environment:
      - MODEL_VERSION=1.0.0
      - OPTIMAL_THRESHOLD=0.35
    restart: unless-stopped

  monitoring-dashboard:
    image: python:3.11-slim
    container_name: fraud-monitoring
    working_dir: /app
    command: bash -c "pip install streamlit requests pandas && streamlit run dashboard/app.py --server.port=8501"
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app/dashboard
      - ./models:/app/models
    depends_on:
      - fraud-api
    restart: unless-stopped
