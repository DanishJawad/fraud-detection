version: '3.8'

services:
  fraud-api:
    build: .
    container_name: fraud-detection-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./monitoring:/app/monitoring
    environment:
      - MODEL_VERSION=1.0.0
      - OPTIMAL_THRESHOLD=0.35
    restart: unless-stopped

  monitoring-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: fraud-monitoring
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://fraud-api:8000
    depends_on:
      - fraud-api
    restart: unless-stopped
