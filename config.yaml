# Default cost assumptions (tune these for business sensitivity)
# Read by scripts/train.py to pick the cost-minimizing threshold during training.
cost_fp: 50   # cost per false positive (e.g., manual review cost or lost revenue)
cost_fn: 500  # cost per false negative (missed fraud)

# UI slider default for the root app.py demo only. The threshold actually used
# by the API is whatever scripts/train.py computed and wrote to
# models/metadata.json — this value is never read by app/main.py.
optimal_threshold: 0.5
