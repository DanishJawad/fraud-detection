# Cost assumptions. These are the only tunable inputs to threshold selection:
# scripts/train.py sweeps thresholds on the validation split and keeps the one
# minimizing (false_positives * cost_fp + false_negatives * cost_fn).
#
# Illustrative figures, not real business numbers. Changing them changes the
# selected threshold, which is the entire point of the sweep — see
# outputs/cost_sensitivity.csv for how much.
cost_fp: 50   # cost per false positive (manual review of a legitimate transaction)
cost_fn: 500  # cost per false negative (missed fraud)

# No threshold here on purpose. The decision threshold is an output of
# training, not a configuration value. It is written to models/metadata.json
# by scripts/train.py and read from there by app/main.py.
