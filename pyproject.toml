[project]
name = "fraud-detection"
version = "0.1.0"
description = "Cost-optimized fraud detection: SMOTE + RandomForest, threshold selected on a validation split, served over FastAPI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.5",
    "pandas==3.0.3",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "imbalanced-learn==0.14.1",
    "joblib==1.5.3",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "streamlit==1.56.0",
]

# Not a distributable package: no build backend, no [tool.setuptools] /
# [tool.hatch] section. This lets `uv sync` manage the venv and lockfile
# without trying to install the repo itself, matching the existing
# PYTHONPATH=. convention documented in the README.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=7.4",
    # Pinned below 0.28: that version removed the httpx.Client(app=...)
    # kwarg that Starlette's TestClient (via fastapi==0.104.1) still relies on.
    "httpx==0.27.2",
]

# Only needed if DATABASE_URL is set for Postgres prediction logging
# (monitoring/db.py). Not required to run the API or dashboard.
# Install with: uv sync --extra postgres
[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
